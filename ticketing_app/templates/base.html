<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Bus Booking</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 flex flex-col min-h-screen">

    <nav class="bg-blue-600 text-white shadow-lg">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center">
                    <a href="/" class="font-bold text-xl tracking-wider">FastTransit Booking</a>
                </div>
                <div class="flex space-x-4">
                    <a href="/" class="hover:bg-blue-700 px-3 py-2 rounded-md font-medium">Home</a>
                    {% if user.is_authenticated %}
                        <span class="px-3 py-2 font-medium">Welcome, {{ user.username }}</span>
                        <a href="/logout" class="bg-red-500 hover:bg-red-600 px-3 py-2 rounded-md font-medium">Logout</a>
                    {% else %}
                        <a href="/login" class="hover:bg-blue-700 px-3 py-2 rounded-md font-medium">Login</a>
                    {% endif %}
                </div>
            </div>
        </div>
    </nav>

    <main class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full">
        {% block content %}
        {% endblock %}
    </main>

    <footer class="bg-gray-800 text-white text-center py-4 mt-auto">
        <p>&copy; 2026 FastTransit Booking System. All rights reserved.</p>
    </footer>

</body>
</html>
