{% extends 'base.html' %}

{% block content %}
<div class="max-w-3xl mx-auto bg-white rounded-lg shadow-xl overflow-hidden mt-10">
    <div class="bg-blue-500 text-white p-6 text-center">
        <h2 class="text-3xl font-extrabold">Where are you traveling to?</h2>
        <p class="mt-2 text-blue-100">Book your bus tickets instantly and securely.</p>
    </div>
    
    <div class="p-8">
        <form action="{% url 'search_buses' %}" method="POST" class="space-y-6">
            {% csrf_token %} <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label class="block text-sm font-medium text-gray-700">Source City</label>
                    <input type="text" name="source_city" required placeholder="e.g., Rohtak" 
                           class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Destination City</label>
                    <input type="text" name="destination_city" required placeholder="e.g., Delhi" 
                           class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500">
                </div>
            </div>
            
            <div>
                <label class="block text-sm font-medium text-gray-700">Date of Journey</label>
                <input type="date" name="travel_date" required 
                       class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500">
            </div>
            
            <button type="submit" class="w-full bg-orange-500 text-white font-bold py-3 px-4 rounded hover:bg-orange-600 transition duration-200">
                Search Buses
            </button>
        </form>
    </div>
</div>
{% endblock %}
